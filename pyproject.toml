[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-miner"
version = "0.1.0"
description = "Autonomous, evidence-driven problem discovery and commercial opportunity intelligence system."
authors = [{ name = "OpportunityMiner Team" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "streamlit>=1.28.0",
    "numpy>=1.24.0",
    "pytest>=7.4.0",
]

[project.scripts]
opportunity-miner = "opportunity_miner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

