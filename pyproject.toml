[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-miner"
version = "0.1.0"
description = "Autonomous, evidence-driven problem discovery and commercial opportunity intelligence system."
authors = [{ name = "OpportunityMiner Team" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "streamlit>=1.28.0",
    "numpy>=1.24.0",
    "pytest>=7.4.0",
    # Free OSS optional — all pip-installable from pypi.org, graceful fallback if absent
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
# pip install -e ".[free-embeddings]"  -> local embeddings (MIT/Apache)
free-embeddings = [
    "sentence-transformers>=2.2.0",  # Apache-2.0, 80MB all-MiniLM-L6-v2
    "fastembed>=0.3.0",              # MIT, ONNX, no torch
    "onnxruntime>=1.16.0",
]
# pip install -e ".[free-vectors]"    -> local vector DBs (Apache-2.0)
free-vectors = [
    "chromadb>=0.4.18",          # Apache-2.0, embedded
    "qdrant-client>=1.9.0",      # Apache-2.0
]
# pip install -e ".[free-scraping]"  -> OSS scraping (MIT/BSD/Apache)
free-scraping = [
    "trafilatura>=1.6.0",        # MIT
    "playwright>=1.40.0",        # Apache-2.0
    "lxml>=4.9.0",
]
# pip install -e ".[free-serp]"     -> free SERP fallback
free-serp = [
    "duckduckgo-search>=5.0.0",  # MIT
]
# pip install -e ".[free-notify]"   -> free notifications (MIT/Apache)
free-notify = [
    "apprise>=1.7.0",            # MIT — 80+ services
]
# Convenience: everything free
free = [
    "sentence-transformers>=2.2.0",
    "fastembed>=0.3.0",
    "onnxruntime>=1.16.0",
    "chromadb>=0.4.18",
    "qdrant-client>=1.9.0",
    "trafilatura>=1.6.0",
    "duckduckgo-search>=5.0.0",
    "apprise>=1.7.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "httpx>=0.24.0",
]

[project.scripts]
opportunity-miner = "opportunity_miner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

